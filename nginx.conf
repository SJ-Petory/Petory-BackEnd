nginx.conf

# ./nginx.conf



worker_processes 1;



events {

    worker_connections 1024;

}



http {

    include       mime.types;

    default_type  application/octet-stream;

    sendfile      on;

    keepalive_timeout 65;



    # --- HTTP (Port 80) 서버 ---

    # 1. Certbot 인증용 경로

    # 2. 나머지 모든 요청은 HTTPS로 리디렉션

    server {

        listen 80;

        listen [::]:80;



        # ⭐️ 여기에 실제 도메인을 입력하세요

        server_name petory.site;



        # Certbot 인증 요청 처리

        location /.well-known/acme-challenge/ {

            # docker-compose에서 마운트한 ./certbot/www 경로

            root /var/www/certbot;

        }



        # 나머지 모든 HTTP 요청을 HTTPS로 강제 리디렉션

        location / {

            return 301 https://$host$request_uri;

        }

    }



    # --- HTTPS (Port 443) 서버 ---

    server {

        listen 443 ssl http2;

        listen [::]:443 ssl http2;



        # ⭐️ 여기에 실제 도메인을 입력하세요

        server_name petory.site;



        # SSL 인증서 경로 (docker-compose에서 마운트한 ./certbot/conf 경로)

        ssl_certificate /etc/letsencrypt/live/petory.site/fullchain.pem;

        ssl_certificate_key /etc/letsencrypt/live/petory.site/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;

        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;



        # (보안 헤더 등 추가 설정... )



        # --- 프론트엔드 React/Vue/Static 파일 서빙 ---

        location / {

            # docker-compose에서 마운트한 ./frontend-build 경로

            root /usr/share/nginx/html;

            index index.html index.htm;



            # React/Vue 라우터가 새로고침 시 404를 방지 (History-mode)

            try_files $uri $uri/ /index.html;

        }



        # --- 백엔드 Spring Boot API 프록시 ---

        location /api/ {

            # docker-compose.yml에 정의된 백엔드 서비스 이름과 포트

            proxy_pass http://petory-backend:8080;

            # (프록시 관련 헤더 설정)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

}